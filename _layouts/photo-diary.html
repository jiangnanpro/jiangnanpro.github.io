---
layout: default
wide: true
---

<div class="photo-diary">
  <header class="photo-diary-header">
    <a class="photo-diary-back" href="{{ '/photos/' | relative_url }}">&larr; All picture diaries</a>
    <h1>{{ page.title }}</h1>
    <p class="photo-diary-meta">
      {% if page.location %}{{ page.location }} · {% endif %}{{ page.date | date: "%B %Y" }}
    </p>
    {% if page.description %}
      <p class="photo-diary-description">{{ page.description }}</p>
    {% endif %}
    {{ content }}
  </header>

  <div class="photo-grid">
    {% for photo in page.photos %}
      <figure class="photo-item">
        <img
          src="{{ photo.image | relative_url }}"
          alt="{{ photo.alt | default: photo.caption | default: page.title }}"
          loading="lazy"
          decoding="async"
          data-zoomable
        >
        {% if photo.caption %}
          <figcaption class="photo-caption">{{ photo.caption }}</figcaption>
        {% endif %}
      </figure>
    {% endfor %}
  </div>
</div>
