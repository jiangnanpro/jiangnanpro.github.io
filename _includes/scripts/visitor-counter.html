<!-- Load only on the configured public hostname so previews do not record visits. -->
<script>
  (function () {
    var publicUrl = {{ site.url | jsonify }};
    if (!publicUrl || window.location.hostname !== new URL(publicUrl).hostname) return;

    var script = document.createElement('script');
    script.async = true;
    script.src = '//cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js';
    document.head.appendChild(script);
  })();
</script>
