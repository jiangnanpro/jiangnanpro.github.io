<style>
  html.homepage-return .post-header,
  html.homepage-return .profile,
  html.homepage-return .post article > .clearfix > *,
  html.homepage-return .post article > .social {
    animation: homepage-enter 0.8s ease-out both;
  }

  html.homepage-return.transition .post-header,
  html.homepage-return.transition .profile,
  html.homepage-return.transition .post article > .clearfix > *,
  html.homepage-return.transition .post article > .social {
    transition: none !important;
  }

  @keyframes homepage-enter {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  html.transition .homepage-reveal {
    transition: none !important;
  }

  html.transition .opening-overlay,
  html.transition .opening-overlay *,
  html.transition .opening-overlay *::before,
  html.transition .opening-overlay *::after {
    transition: none !important;
  }
  .opening-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2000;
    overflow: hidden;
    background: var(--global-bg-color);
  }

  html.opening-armed {
    overflow: hidden;
  }

  html.opening-armed .opening-overlay {
    display: block;
  }

  html.opening-armed body > header,
  html.opening-armed body > .container,
  html.opening-armed body > footer,
  html.opening-armed .opening-loader {
    visibility: hidden;
  }

  html.opening-armed.opening-ready .opening-loader {
    visibility: visible;
  }

  .opening-loader {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .opening-name {
    display: flex;
    align-items: center;
    white-space: nowrap;
    font-size: clamp(1.6rem, 6vw, 6.5rem);
    font-weight: 400;
    line-height: 1;
  }

  .opening-name-part {
    display: flex;
    overflow: hidden;
    padding-bottom: 0.08em;
    margin-bottom: -0.08em;
  }

  .opening-letter {
    display: block;
    color: inherit;
    transform: translateY(110%);
    will-change: transform;
  }

  .opening-gap {
    position: relative;
    flex: none;
    width: 0.28em;
    height: 0.82em;
  }

  .opening-cube {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 1;
    width: 0;
    height: 0.82em;
    background: #0076df;
    visibility: hidden;
    opacity: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    html.homepage-return .post-header,
    html.homepage-return .profile,
    html.homepage-return .post article > .clearfix > *,
    html.homepage-return .post article > .social {
      animation: none;
    }
    .opening-overlay {
      display: none;
    }
  }
</style>

<script>
  try {
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add(sessionStorage.getItem('opening_seen') ? 'homepage-return' : 'opening-armed');
    }
  } catch (error) {}
</script>
